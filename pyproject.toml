[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oven-multiskill-runtime"
version = "0.1.0"
description = "Fail-closed dual-host runtime for the oven multi-skill robot pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "msgpack>=1.0",
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
  "websockets>=14,<17",
]

[project.scripts]
oven-fake-server = "oven_runtime.server.app:main"
oven-server = "oven_runtime.server.app:main"
oven-server-preflight = "oven_runtime.server.preflight:main"
oven-serverctl = "oven_runtime.server.control_cli:main"
oven-edge = "oven_runtime.edge.app:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
